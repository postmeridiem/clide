name: release

# Build + publish a versioned Linux release bundle for a commit on main that
# passed the test workflow (T-608): it runs when `test` completes successfully
# on a push to main, builds exactly that commit, and publishes only when no
# GitHub Release exists yet for its v<version> — so an ordinary commit is a
# no-op, and a release commit whose tests fail is never published. (Installing
# an update is one click since D-113; an untested build must not reach it.)
#
# It checks for the *Release*, not the tag: `make release` creates and pushes
# the v<version> tag together with the release commit, so a tag check always
# found it already there and silently skipped every release after v2.8.1.
#
# Manual runs can pass `tag` to (re)build an existing release tag from that
# tag's own tree — used to backfill releases the old tag check skipped.
#
# macOS and Windows bundles ship as untested previews so the tray/Dock work
# (T-592, T-593) can be exercised on real machines. They never gate the Linux
# release: publish needs only build-linux to succeed, and attaches whatever
# preview bundles built. The in-app updater only ever fetches the Linux asset.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from (e.g. v2.15.0); empty = main'
        required: false
        default: ''

permissions:
  contents: write   # create the release

jobs:
  version:
    # A manual run, or a green test run for a push to main (never a PR's).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      fresh: ${{ steps.v.outputs.fresh }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the tests passed on — github.sha would be main's head
          # at the time this run starts, possibly a later, untested commit.
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk -F': *' '/^version:/ {gsub(/[" ]/,"",$2); print $2; exit}' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "v$version already has a GitHub Release — nothing to publish."
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no GitHub Release yet — building."
          fi

  build-linux:
    needs: version
    if: needs.version.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - id: fvm   # the Flutter pin lives in .fvmrc — never float on `stable`
        shell: bash
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ steps.fvm.outputs.flutter }}', channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: make dugite-fetch
      - run: make build            # gen-build-info + clide-cli + flutter build linux
      - name: package
        run: tar -C build/linux/x64/release/bundle -czf clide-linux-x64-${{ needs.version.outputs.version }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: clide-linux-x64-*.tar.gz }

  desktop:
    needs: version
    if: needs.version.outputs.fresh == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build-linux, desktop]
    # always() so a failed preview build doesn't skip the Linux release.
    if: always() && needs.version.outputs.fresh == 'true' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: changelog notes for this version
        shell: bash
        run: |
          ver="${{ needs.version.outputs.version }}"
          # Pull the entries under `## [<version>]` — the changelog cut that the
          # version-bump commit lands per the changelog discipline — as the
          # release body; fall back to a one-liner if the section is absent.
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release v$ver." > release-notes.md
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: clide v${{ needs.version.outputs.version }}
          body_path: release-notes.md     # the version's CHANGELOG section
          generate_release_notes: true    # + auto commit list appended
          files: dist/**/*                # the built versioned bundles
