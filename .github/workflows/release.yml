name: release

# Build + publish a versioned Linux release bundle when the version in
# pubspec.yaml changes on main. The `version` job only proceeds when no GitHub
# Release exists yet for v<version>, so an unrelated pubspec edit is a no-op.
#
# It checks for the *Release*, not the tag: `make release` creates and pushes
# the v<version> tag together with the release commit, so a tag check always
# found it already there and silently skipped every release after v2.8.1.
#
# Manual runs can pass `tag` to (re)build an existing release tag from that
# tag's own tree — used to backfill releases the old tag check skipped.
#
# Windows is out of the release for now (not yet built or tested since 2.8.1);
# it returns once the Windows port is exercised (see windows.yml).

on:
  push:
    branches: [main]
    paths: ['pubspec.yaml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from (e.g. v2.15.0); empty = main'
        required: false
        default: ''

permissions:
  contents: write   # create the release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      fresh: ${{ steps.v.outputs.fresh }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk -F': *' '/^version:/ {gsub(/[" ]/,"",$2); print $2; exit}' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "v$version already has a GitHub Release — nothing to publish."
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no GitHub Release yet — building."
          fi

  build-linux:
    needs: version
    if: needs.version.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - id: fvm   # the Flutter pin lives in .fvmrc — never float on `stable`
        shell: bash
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ steps.fvm.outputs.flutter }}', channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: make dugite-fetch
      - run: make build            # gen-build-info + clide-cli + flutter build linux
      - name: package
        run: tar -C build/linux/x64/release/bundle -czf clide-linux-x64-${{ needs.version.outputs.version }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: clide-linux-x64-*.tar.gz }

  publish:
    needs: [version, build-linux]
    if: needs.version.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: changelog notes for this version
        shell: bash
        run: |
          ver="${{ needs.version.outputs.version }}"
          # Pull the entries under `## [<version>]` — the changelog cut that the
          # version-bump commit lands per the changelog discipline — as the
          # release body; fall back to a one-liner if the section is absent.
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release v$ver." > release-notes.md
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: clide v${{ needs.version.outputs.version }}
          body_path: release-notes.md     # the version's CHANGELOG section
          generate_release_notes: true    # + auto commit list appended
          files: dist/**/*                # the built versioned bundles
